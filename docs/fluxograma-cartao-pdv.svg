<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="warn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="danger" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L14,7 L0,14 z" fill="#94a3b8"/>
    </marker>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #f8fafc; }
      .subtitle { font: 400 15px Arial, sans-serif; fill: #cbd5e1; }
      .box-title { font: 700 18px Arial, sans-serif; fill: #f8fafc; }
      .box-text { font: 400 14px Arial, sans-serif; fill: #e5e7eb; }
      .label { font: 700 13px Arial, sans-serif; fill: #0f172a; letter-spacing: 0.4px; }
      .small { font: 400 12px Arial, sans-serif; fill: #94a3b8; }
      .line { stroke: #94a3b8; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .line-soft { stroke: #64748b; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .node { filter: url(#shadow); }
    </style>
  </defs>

  <rect width="1400" height="980" fill="url(#bg)"/>

  <text x="70" y="72" class="title">Fluxograma do PDV de Cartão</text>
  <text x="70" y="102" class="subtitle">Leitura do cartão, emissão quando não existir e ações principais quando o cartão já estiver cadastrado.</text>

  <!-- Start -->
  <g class="node">
    <rect x="520" y="140" rx="22" ry="22" width="360" height="86" fill="url(#accent)"/>
    <text x="700" y="178" text-anchor="middle" class="box-title">Leitura do cartão</text>
    <text x="700" y="202" text-anchor="middle" class="box-text">Operador lê NFC, QR ou código manual</text>
  </g>

  <line x1="700" y1="226" x2="700" y2="284" class="line"/>

  <!-- Lookup -->
  <g class="node">
    <rect x="500" y="286" rx="22" ry="22" width="400" height="96" fill="url(#card)" stroke="#334155" stroke-width="2"/>
    <text x="700" y="324" text-anchor="middle" class="box-title">Buscar cartão pelo token_nfc</text>
    <text x="700" y="348" text-anchor="middle" class="box-text">Se não encontrar, abre o fluxo de emissão</text>
  </g>

  <line x1="700" y1="382" x2="700" y2="440" class="line"/>

  <!-- Decision -->
  <g class="node">
    <path d="M700 440 L850 520 L700 600 L550 520 Z" fill="#0b1220" stroke="#64748b" stroke-width="2.5"/>
    <text x="700" y="512" text-anchor="middle" class="box-title">Cartão existe?</text>
  </g>

  <!-- Left branch -->
  <line x1="550" y1="520" x2="370" y2="520" class="line-soft"/>
  <g>
    <rect x="110" y="474" rx="20" ry="20" width="250" height="92" fill="url(#warn)" class="node"/>
    <text x="235" y="510" text-anchor="middle" class="box-title">Não</text>
    <text x="235" y="534" text-anchor="middle" class="box-text">Abrir emissão do cartão</text>
    <text x="235" y="556" text-anchor="middle" class="small">Vincular cliente novo ou existente</text>
  </g>
  <text x="392" y="507" class="label">NÃO</text>

  <line x1="235" y1="566" x2="235" y2="644" class="line"/>

  <g class="node">
    <rect x="75" y="646" rx="22" ry="22" width="320" height="116" fill="#1f2937" stroke="#475569" stroke-width="2"/>
    <text x="235" y="682" text-anchor="middle" class="box-title">Fluxo de emissão</text>
    <text x="235" y="706" text-anchor="middle" class="box-text">Gerar código único</text>
    <text x="235" y="728" text-anchor="middle" class="box-text">Gerar token NFC e QR</text>
    <text x="235" y="750" text-anchor="middle" class="box-text">Salvar cartão como ATIVO</text>
  </g>

  <!-- Right branch -->
  <line x1="850" y1="520" x2="1030" y2="520" class="line-soft"/>
  <g>
    <rect x="1010" y="474" rx="20" ry="20" width="280" height="92" fill="url(#accent)" class="node"/>
    <text x="1150" y="510" text-anchor="middle" class="box-title">Sim</text>
    <text x="1150" y="534" text-anchor="middle" class="box-text">Abrir painel do cartão</text>
    <text x="1150" y="556" text-anchor="middle" class="small">Cliente e situação já carregados</text>
  </g>
  <text x="865" y="507" class="label">SIM</text>

  <line x1="1150" y1="566" x2="1150" y2="642" class="line"/>

  <g class="node">
    <rect x="880" y="644" rx="22" ry="22" width="540" height="168" fill="#111827" stroke="#334155" stroke-width="2"/>
    <text x="1150" y="682" text-anchor="middle" class="box-title">Ações disponíveis no painel do cartão</text>
    <text x="1150" y="712" text-anchor="middle" class="box-text">Recarga</text>
    <text x="1150" y="736" text-anchor="middle" class="box-text">Inserir cashback, se houver regra válida</text>
    <text x="1150" y="760" text-anchor="middle" class="box-text">Bloquear / desbloquear conforme permissão</text>
    <text x="1150" y="784" text-anchor="middle" class="box-text">Ver extrato rápido e dados do cliente</text>
  </g>

  <!-- Common suggestions -->
  <g class="node">
    <rect x="450" y="820" rx="22" ry="22" width="500" height="96" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <text x="700" y="856" text-anchor="middle" class="box-title">Outras ações sugeridas</text>
    <text x="700" y="882" text-anchor="middle" class="box-text">Estorno, ajuste manual restrito, troca de cartão, cancelamento e consulta de saldo</text>
  </g>

  <line x1="700" y1="600" x2="700" y2="820" class="line"/>
  <line x1="1150" y1="812" x2="700" y2="820" class="line-soft"/>

  <text x="70" y="946" class="small">Base desenhada para o PDV de cartão: leitura primeiro, emissão se não existir, painel de ações se existir.</text>
</svg>
